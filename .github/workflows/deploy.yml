name: Deploy to server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, havit-backend]
    timeout-minutes: 15
    steps:
      - name: Actualizar backend y reconstruir el contenedor
        run: |
          set -e
          flock /tmp/havit-deploy.lock -c '
            cd /home/azureuser/backend
            git fetch origin main
            git checkout main
            git merge --ff-only origin/main
            cd /home/azureuser/raiz
            # docker-compose v1 (lo unico instalado en el servidor) revienta con
            # KeyError ContainerConfig al intentar recrear un contenedor existente
            # in-place; bajar y volver a levantar evita ese codepath
            docker-compose down --remove-orphans
            docker-compose up -d --build
          '

      - name: Verificar que el backend responde
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "backend respondiendo"
              exit 0
            fi
            sleep 5
          done
          echo "el backend no respondio a tiempo tras el deploy"
          exit 1
